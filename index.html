<!DOCTYPE html>
<html lang="IT-it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="Resources/images/Favicon-XboxController.png">
    <link rel="stylesheet" href="Resources/Style/style.css" type="text/CSS">
    <script src="Resources/Javascript/scriptHead.js"></script>
</head>
<body>
    <div class="container">
        <h1 id="title"></h1>
        <div class="bet">
            <p>Il tuo credito rimanente è: <span id="totalAmount"></span>€</p>
            <label for="betAmount">Inserisci l'importo della tua scommessa:</label>
            <input type="number" id="betAmount" inputmode="numeric" placeholder="0">
        </div>
        <div class="azioni">
            <h2>Fai la tua mossa:</h2>
            <button id="sasso" onclick="placeBet('Sasso')">
                <img src="Resources/Images/Sasso.png" alt="Sasso">
            </button>
            <button id="carta" onclick="placeBet('Carta')">
                <img src="Resources/Images/Carta.png" alt="Carta">
            </button>
            <button id="forbici" onclick="placeBet('Forbici')">
                <img src="Resources/Images/Forbici.png" alt="Forbici">
            </button>
        </div>
        <p class="risultato" id="risultato"></p>
    </div>

    <script src="Resources/Javascript/scriptBetBody.js"></script>
    <script src="Resources/Javascript/scriptGameBody.js"></script>
</body>
</html>
